  <script>
    (function () {
      const initialHref = window.location.href;
      const initialUrl = new URL(initialHref);
      const isCardDetailPath = /^\/marketplace\/[a-z]{2}(?:-[a-z]{2})?\/cards\/\d+\/[^/?#]+$/i.test(
        initialUrl.pathname
      );
      window.__pokoinInitialHref = initialHref;
      if (!isCardDetailPath || !window.history) {
        return;
      }
      const originalPushState = window.history.pushState;
      const originalReplaceState = window.history.replaceState;
      const shouldBlockRootDrift = function (url) {
        if (url === undefined || url === null) {
          return false;
        }
        try {
          const target = new URL(String(url), window.location.origin);
          return target.pathname === '/' && window.location.pathname === initialUrl.pathname;
        } catch (_) {
          return false;
        }
      };
      window.history.pushState = function (state, title, url) {
        if (shouldBlockRootDrift(url)) {
          console.warn('Blocked card detail root pushState drift', { from: initialHref, to: url });
          return;
        }
        return originalPushState.apply(this, arguments);
      };
      window.history.replaceState = function (state, title, url) {
        if (shouldBlockRootDrift(url)) {
          console.warn('Blocked card detail root replaceState drift', { from: initialHref, to: url });
          return;
        }
        return originalReplaceState.apply(this, arguments);
      };
      window.setTimeout(function () {
        window.history.pushState = originalPushState;
        window.history.replaceState = originalReplaceState;
      }, 30000);
    })();
  </script>
  <script>
    window.pokoinWallet = {
      hasProvider: function () {
        return typeof window.ethereum !== 'undefined';
      },
      isMobile: function () {
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
      },
      openMetaMaskDapp: function () {
        if (!window.pokoinWallet.isMobile()) {
          return false;
        }
        const target = `${window.location.host}${window.location.pathname}${window.location.search}${window.location.hash}`;
        window.location.href = `https://metamask.app.link/dapp/${target}`;
        return true;
      },
      openMetaMaskDappUrl: function (url) {
        if (!window.pokoinWallet.isMobile()) {
          return false;
        }
        const target = new URL(url, window.location.origin);
        window.location.href = `https://metamask.app.link/dapp/${target.host}${target.pathname}${target.search}${target.hash}`;
        return true;
      },
      requestAccounts: function () {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({ method: 'eth_requestAccounts' });
      },
      getAccounts: function () {
        if (!window.ethereum) {
          return Promise.resolve([]);
        }
        return window.ethereum.request({ method: 'eth_accounts' });
      },
      onAccountsChanged: function (callback) {
        if (!window.ethereum || !window.ethereum.on) {
          return;
        }
        if (window.pokoinWallet._accountsChangedCallback && window.ethereum.removeListener) {
          window.ethereum.removeListener(
            'accountsChanged',
            window.pokoinWallet._accountsChangedCallback
          );
        }
        window.pokoinWallet._accountsChangedCallback = callback;
        window.ethereum.on('accountsChanged', callback);
      },
      onChainChanged: function (callback) {
        if (!window.ethereum || !window.ethereum.on) {
          return;
        }
        window.ethereum.on('chainChanged', callback);
      },
      signMessage: function (address, message) {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'personal_sign',
          params: [message, address]
        }).catch((error) => Promise.reject(window.pokoinWallet._walletError(error)));
      },
      addNetwork: function () {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x18dacca',
            chainName: 'PokoinPoS',
            nativeCurrency: {
              name: 'Pokoin',
              symbol: 'PKN',
              decimals: 18
            },
            rpcUrls: ['https://rpc.pokoin.com/rpc'],
            blockExplorerUrls: ['https://explorer.pokoin.com']
          }]
        });
      },
      switchNetwork: function () {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x18dacca' }]
        });
      },
      _walletError: function (error) {
        if (!error) {
          return new Error('Wallet request failed');
        }
        if (typeof error === 'string') {
          return new Error(error);
        }
        const message = error.message || error.reason || error.data?.message || 'Wallet request failed';
        const code = error.code !== undefined ? ` (${error.code})` : '';
        return new Error(`${message}${code}`);
      },
      sendTransaction: function (from, to, valueHex) {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{
            from: from,
            to: to,
            value: valueHex,
            chainId: '0x18dacca',
            gas: '0x5208',
            gasPrice: '0x3b9aca00'
          }]
        }).catch((error) => Promise.reject(window.pokoinWallet._walletError(error)));
      },
      sendExternalTransaction: function (from, to, valueHex, chainIdHex) {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        const chainId = chainIdHex || '0x1';
        return window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: chainId }]
        }).then(function () {
          return window.ethereum.request({
            method: 'eth_sendTransaction',
            params: [{
              from: from,
              to: to,
              value: valueHex,
              chainId: chainId,
              gas: '0x5208'
            }]
          });
        }).catch((error) => Promise.reject(window.pokoinWallet._walletError(error)));
      },
      sendExternalTokenTransfer: function (from, tokenAddress, to, amountHex, chainIdHex) {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        const chainId = chainIdHex || '0x38';
        const cleanTo = String(to || '').replace(/^0x/, '').padStart(64, '0');
        const cleanAmount = String(amountHex || '0x0').replace(/^0x/, '').padStart(64, '0');
        const data = `0xa9059cbb${cleanTo}${cleanAmount}`;
        return window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: chainId }]
        }).then(function () {
          return window.ethereum.request({
            method: 'eth_sendTransaction',
            params: [{
              from: from,
              to: tokenAddress,
              value: '0x0',
              data: data,
              chainId: chainId
            }]
          });
        }).catch((error) => Promise.reject(window.pokoinWallet._walletError(error)));
      },
      sendDataTransaction: function (from, to, valueHex, dataHex, nonceHex) {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        const tx = {
          from: from,
          to: to,
          value: valueHex || '0x0',
          data: dataHex,
          chainId: '0x18dacca',
          gas: '0x1d4c0',
          gasPrice: '0x3b9aca00'
        };
        if (nonceHex) {
          tx.nonce = nonceHex;
        }
        return window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [tx]
        }).catch((error) => Promise.reject(window.pokoinWallet._walletError(error)));
      }
    };
  </script>
