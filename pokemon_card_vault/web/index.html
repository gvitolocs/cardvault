    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pokoin",
      "alternateName": "Pokoin Crypto",
      "url": "https://pokoin.com/",
      "description": "Pokoin crypto website for PKN, wPKN, CardVault marketplace, wallet, Pokoin Scan explorer, and network health.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://pokoin.com/scan?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }
  </script>
  <script>
    window.pokoinWallet = {
      hasProvider: function () {
        return typeof window.ethereum !== 'undefined';
      },
      requestAccounts: function () {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({ method: 'eth_requestAccounts' });
      },
      addNetwork: function () {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x18dacca',
            chainName: 'PokoinPoS',
            nativeCurrency: {
              name: 'Pokoin',
              symbol: 'PKN',
              decimals: 18
            },
            rpcUrls: ['https://rpc.pokoin.com/rpc'],
            blockExplorerUrls: ['https://explorer.pokoin.com']
          }]
        });
      },
      switchNetwork: function () {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x18dacca' }]
        });
      },
      sendTransaction: function (from, to, valueHex) {
        if (!window.ethereum) {
          return Promise.reject('MetaMask or another EVM wallet is not available');
        }
        return window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{ from: from, to: to, value: valueHex }]
        });
      }
    };
  </script>
