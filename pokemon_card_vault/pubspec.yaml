name: pokemon_card_vault
description: "A complete Pokemon card ecommerce app with advanced features"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  flutter_screenutil: ^5.9.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # HTTP & API
  http: ^1.1.2
  connectivity_plus: ^5.0.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication & Security
  crypto: ^3.0.3
  
  # Image & Media
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  # carousel_slider: ^4.2.1  # Temporarily disabled due to Flutter 3.24 conflicts
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  lottie: ^2.7.0
  flutter_spinkit: ^5.2.0
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # QR Code & Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  
  # Maps & Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
  
  # fonts:
  #   - family: Pokemon
  #     fonts:
  #       - asset: assets/fonts/Pokemon.ttf
  #       - asset: assets/fonts/Pokemon-Bold.ttf
  #         weight: 700