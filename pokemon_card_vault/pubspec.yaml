name: pokoin
description: "Pokoin marketplace, wallet, and card reserve app"
publish_to: 'none'

version: 1.0.0+58

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  flutter_screenutil: ^5.9.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # HTTP & API
  http: ^1.1.2
  connectivity_plus: ^7.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication & Security
  crypto: ^3.0.3
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  google_sign_in: ^6.2.2
  
  # Image & Media
  cached_network_image: ^3.3.0
  crop_your_image: ^2.0.0
  image_picker: ^1.2.2
  image: ^4.8.0
  camera: ^0.12.0+1
  camera_android: ^0.10.10+5
  path_provider: ^2.1.5
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  # carousel_slider: ^4.2.1  # Temporarily disabled due to Flutter 3.24 conflicts
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  lottie: ^3.5.1
  flutter_spinkit: ^5.2.0
  
  # Utils
  intl: ^0.19.0
  web: ^1.1.1
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  
  # Notifications
  flutter_local_notifications: ^19.0.0
  
  # QR Code & Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  
  # Maps & Location
  geolocator: ^14.0.1
  google_maps_flutter: ^2.17.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - web/pokoin.svg
    - assets/brand/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/models/card_detector.tflite
    - assets/models/milo.onnx
    - assets/models/milo_fp16.onnx
    - assets/models/milo_cnn.onnx
    - assets/milo_index/western/embeddings.bin
    - assets/milo_index/western/metadata.jsonl
    - assets/milo_index/western/manifest.json
    - assets/milo_index/japanese/embeddings.bin
    - assets/milo_index/japanese/metadata.jsonl
    - assets/milo_index/japanese/manifest.json
    - assets/milo_index/chinese/embeddings.bin
    - assets/milo_index/chinese/metadata.jsonl
    - assets/milo_index/chinese/manifest.json
    - assets/milo_cnn_index/western/embeddings.bin
    - assets/milo_cnn_index/western/metadata.jsonl
    - assets/milo_cnn_index/western/manifest.json
    - assets/milo_cnn_index/japanese/embeddings.bin
    - assets/milo_cnn_index/japanese/metadata.jsonl
    - assets/milo_cnn_index/japanese/manifest.json
    - assets/milo_cnn_index/chinese/embeddings.bin
    - assets/milo_cnn_index/chinese/metadata.jsonl
    - assets/milo_cnn_index/chinese/manifest.json
    - assets/pokoin-icon.png
    - assets/pokoin-icon-opaque.png
    - assets/pokoin_tcg_ids.json
  
  # fonts:
  #   - family: Pokemon
  #     fonts:
  #       - asset: assets/fonts/Pokemon.ttf
  #       - asset: assets/fonts/Pokemon-Bold.ttf
  #         weight: 700